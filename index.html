    <!-- Sets the theme before the first paint, so a dark-mode visitor never
         sees a light flash. Same key and rules as src/theme/ThemeProvider.tsx
         (src/indexHtml.test.tsx checks that they agree). -->
    <script>
      (function () {
        try {
          var mode = null;
          try {
            mode = window.localStorage.getItem('netsteps.theme');
          } catch (e) {
            mode = null;
          }
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {
          // Leave the theme to the app.
        }
      })();
    </script>
